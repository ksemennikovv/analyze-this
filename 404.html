<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Страница не найдена | Intrelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 16px 80px;
      min-height: 60vh;
    }
    .error-page__code {
      font-size: clamp(80px, 20vw, 160px);
      font-weight: 700;
      line-height: 1;
      color: var(--gray-40);
      margin-bottom: 16px;
    }
    .error-page__title {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .error-page__subtitle {
      font-size: 16px;
      color: var(--gray-300);
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .error-page__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 28px;
      height: 48px;
      border-radius: 12px;
      background: var(--color-primary);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .error-page__btn:hover {
      background: var(--color-primary-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-wrapper">
      <div class="container">
        <div class="nav-inner">

          <div class="nav-left">
            <a href="/" class="logo-link">
              <img src="/img/logo.svg" alt="Intrelo" class="logo">
            </a>
          </div>

          <nav class="nav-links">
            <a href="/prices"   class="nav-link">Цены</a>
            <a href="/services" class="nav-link">Услуги</a>
            <a href="/blog"     class="nav-link">Блог</a>
            <a href="/about"    class="nav-link">О компании</a>
            <a href="/contacts" class="nav-link">Контакты</a>
          </nav>

          <div class="nav-actions">
            <a href="https://t.me/intrelo" class="header__social header__social--telegram"
               aria-label="Написать в Telegram" target="_blank" rel="noopener noreferrer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
              </svg>
            </a>
            <a href="https://wa.me/74954804848" class="header__social header__social--whatsapp"
               aria-label="Написать в WhatsApp" target="_blank" rel="noopener noreferrer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
              </svg>
            </a>

            <a href="https://max.ru/" class="header__social header__social--max"
               aria-label="Написать в Max" target="_blank" rel="noopener noreferrer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
              </svg>
            </a>

            <div class="nav-contacts">
              <a href="tel:+74954804848" class="nav-contacts__phone">+7(495) 480-48-48</a>
              <a href="mailto:order@perevozki-veshey.ru" class="nav-contacts__email">order@perevozki-veshey.ru</a>
            </div>

            <button type="button" class="burger-toggle" aria-label="Открыть меню">
              <span></span><span></span><span></span>
            </button>
          </div>

        </div>
      </div>
    </div>

    <div class="burger-menu" id="burger-menu">
      <div class="container">
        <nav class="burger-menu__links">
          <a href="/prices"   class="nav-link">Цены</a>
          <a href="/services" class="nav-link">Услуги</a>
          <a href="/blog"     class="nav-link">Блог</a>
          <a href="/about"    class="nav-link">О компании</a>
          <a href="/contacts" class="nav-link">Контакты</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="error-page container">
      <div class="error-page__code">404</div>
      <h1 class="error-page__title">Страница не найдена</h1>
      <p class="error-page__subtitle">Возможно, адрес изменился или страница была удалена. Вернитесь на главную.</p>
      <a href="/" class="error-page__btn">
        На главную
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
